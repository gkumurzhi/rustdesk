# Slim Android-only build of RustDesk with a custom package name (applicationId).
#
# Derived from the upstream jobs `generate_bridge` (.github/workflows/bridge.yml) and
# `build-rustdesk-android` (.github/workflows/flutter-build.yml) of tag 1.5.1.
# Only the parts needed for Android are kept; the APK is uploaded as a workflow
# artifact instead of being published to a GitHub release.
#
# Signing: add these repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_SIGNING_KEY         base64 of the release keystore (.jks)
#   ANDROID_ALIAS               key alias
#   ANDROID_KEY_STORE_PASSWORD  keystore password
#   ANDROID_KEY_PASSWORD        key password (same as keystore password for PKCS12)
# Without ANDROID_SIGNING_KEY the APK is uploaded signed with the runner's debug key.
#
# Manual / API runs (workflow_dispatch) take three inputs: version (an upstream tag),
# application_id and apk_basename. Sources are always checked out from rustdesk/rustdesk
# at that tag; this fork only supplies the workflow and the signing secrets.
#
# NOTE: never push tags to this fork - upstream flutter-tag.yml / fdroid.yml run on tag push.

name: Build custom Android APK
# Shown in the runs list; the Deskport Factory app displays it as the build title.
run-name: "${{ github.event.inputs.application_id || 'net.quillfern.deskport' }} @ ${{ github.event.inputs.version || '1.5.1' }}"

on:
  push:
    branches:
      - android-custom
  workflow_dispatch:
    inputs:
      version:
        description: "RustDesk version tag to build (e.g. 1.5.1)"
        default: "1.5.1"
      application_id:
        description: "Custom package name (applicationId)"
        default: "net.quillfern.deskport"
      apk_basename:
        description: "APK file base name"
        default: "deskport"

permissions:
  contents: read

concurrency:
  # One build per (version, package): a re-run of the same pair replaces the older one,
  # different pairs build side by side.
  group: android-custom-${{ github.ref }}-${{ github.event.inputs.version || 'default' }}-${{ github.event.inputs.application_id || 'default' }}
  cancel-in-progress: true

env:
  # Defaults are used by the push trigger; workflow_dispatch overrides them via inputs.
  # applicationId in build.gradle is overwritten with APP_ID at build time (see "Set applicationId").
  APP_ID: ${{ github.event.inputs.application_id || 'net.quillfern.deskport' }}
  APK_BASENAME: ${{ github.event.inputs.apk_basename || 'deskport' }}
  VERSION: ${{ github.event.inputs.version || '1.5.1' }}
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"

jobs:
  generate-bridge:
    name: generate flutter-rust-bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.VERSION }}
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ env.BRIDGE_FLUTTER_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution (same as upstream).
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-android:
    needs: [generate-bridge]
    name: build android apk ${{ matrix.job.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              abi: arm64-v8a,
              flutter-platform: android-arm64,
              ndk-script: ndk_arm64.sh,
              libcxx-dir: aarch64-linux-android,
            }
          # To build more ABIs, add entries like these:
          # - { arch: armv7, target: armv7-linux-androideabi, abi: armeabi-v7a,
          #     flutter-platform: android-arm, ndk-script: ndk_arm.sh, libcxx-dir: arm-linux-androideabi }
          # - { arch: x86_64, target: x86_64-linux-android, abi: x86_64,
          #     flutter-platform: android-x64, ndk-script: ndk_x64.sh, libcxx-dir: x86_64-linux-android }
    env:
      APK_NAME: ${{ github.workspace }}/signed-apk/${{ github.event.inputs.apk_basename || 'deskport' }}-${{ github.event.inputs.version || '1.5.1' }}-${{ matrix.job.arch }}.apk
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.VERSION }}
          submodules: recursive

      - name: Use the tool versions pinned by this RustDesk version
        shell: bash
        run: |
          # Upstream bumps NDK / vcpkg / Flutter between releases. Take them from the checked-out
          # tag's own flutter-build.yml; the values in this workflow's env stay as the fallback.
          F=.github/workflows/flutter-build.yml
          for key in RUST_VERSION CARGO_NDK_VERSION ANDROID_FLUTTER_VERSION NDK_VERSION VCPKG_COMMIT_ID; do
            val="$(sed -nE "/^  ${key}: /{s/^  ${key}: *\"([^\"]+)\".*/\1/p;q}" "$F" 2>/dev/null || true)"
            if [[ -n "$val" ]]; then
              echo "${key}=${val}" >> "$GITHUB_ENV"
              echo "${key}=${val} (from ${F})"
            else
              echo "${key}=${!key} (fallback: not found in ${F})"
            fi
          done

      - name: Set applicationId in build.gradle
        shell: bash
        run: |
          # Fail in the first minutes instead of after the whole native build.
          if [[ ! "$APP_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "::error::invalid application_id '${APP_ID}'"; exit 1
          fi
          if [[ ! "$APK_BASENAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::invalid apk_basename '${APK_BASENAME}'"; exit 1
          fi
          sed -i "s|applicationId \"[^\"]*\"|applicationId \"${APP_ID}\"|" flutter/android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" flutter/android/app/build.gradle \
            || { echo "::error::failed to set applicationId=${APP_ID} in build.gradle"; exit 1; }

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        shell: bash
        run: |
          cd $(dirname $(dirname $(which flutter)))
          PATCH=${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          if [[ "3.24.5" == "${{ env.ANDROID_FLUTTER_VERSION }}" && -f "$PATCH" ]]; then
            git apply "$PATCH"
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk-script }}

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Build with the debug signing config; the release key is applied afterwards
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          JNI_DIR=./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          mkdir -p "$JNI_DIR"
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.libcxx-dir }}/libc++_shared.so "$JNI_DIR/"
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so "$JNI_DIR/librustdesk.so"
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.flutter-platform }} --split-per-abi
          popd
          mkdir -p signed-apk
          mv flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk "$APK_NAME"

      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: Setup build-tools version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo "AAPT2=/usr/local/lib/android/sdk/build-tools/$BUILD_TOOL_VERSION/aapt2" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Verify package name
        shell: bash
        env:
          ABI: ${{ matrix.job.abi }}
        run: |
          # GitHub runs bash with -eo pipefail, so a failing aapt2 call fails the step.
          BADGING="$("$AAPT2" dump badging "$APK_NAME")"
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          printf '%s\n' "$BADGING" | grep -E "^(package|native-code):"
          if [[ "$PKG" != "$APP_ID" ]]; then
            echo "::error::APK package name '${PKG:-<none>}' does not match expected '${APP_ID}'"
            exit 1
          fi
          # The Rust core must be packed into the APK, otherwise the app crashes on start.
          # (no "unzip | grep -q": with pipefail an early grep exit can SIGPIPE unzip on big APKs)
          unzip -l "$APK_NAME" "lib/${ABI}/librustdesk.so" >/dev/null \
            || { echo "::error::lib/${ABI}/librustdesk.so is missing from the APK"; exit 1; }
          echo "OK: package=${PKG}, lib/${ABI}/librustdesk.so present"

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign app APK
        if: env.ANDROID_SIGNING_KEY != null
        id: sign-rustdesk
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # env.ANDROID_SIGN_TOOL_VERSION is set by step "Setup build-tools version variable"
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Upload signed APK
        if: env.ANDROID_SIGNING_KEY != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_BASENAME }}-${{ env.VERSION }}-${{ matrix.job.arch }}-signed
          path: ${{ steps.sign-rustdesk.outputs.signedReleaseFile }}
          retention-days: 30

      - name: Upload debug-signed APK
        if: env.ANDROID_SIGNING_KEY == null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_BASENAME }}-${{ env.VERSION }}-${{ matrix.job.arch }}-debugsigned
          path: ${{ env.APK_NAME }}
          retention-days: 30
